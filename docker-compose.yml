services:
  postgres:
    image: postgres:15-alpine
    container_name: rideshare-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rideshare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rideshare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rideshare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./rideshare-rest-graphQL
    container_name: rideshare-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rideshare_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - DEBUG=true
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  audit-service:
    build: ./audit-service
    container_name: rideshare-audit-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8085/realms/rideshare
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/rideshare/protocol/openid-connect/certs
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES=audit-service
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: rideshare-notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  grpc-server:
    build: ./ride-grpc-server
    container_name: rideshare-grpc-server
    ports:
      - "8083:8083"
      - "9090:9090"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  grpc-client:
    build: ./ride-grpc-client
    container_name: rideshare-grpc-client
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - GRPC_CLIENT_ANALYTICS_SERVER_HOST=grpc-server
      - GRPC_CLIENT_ANALYTICS_SERVER_PORT=9090
    depends_on:
      rabbitmq:
        condition: service_healthy
      grpc-server:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: rideshare-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "8085:8080"
    volumes:
      - ./infra/keycloak/rideshare-realm.json:/opt/keycloak/data/import/rideshare-realm.json:ro
    networks:
      - default

volumes:
  postgres_data: