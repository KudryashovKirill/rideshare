services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rideshare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./rideshare-rest-graphQL
    container_name: rideshare-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  audit-service:
    build: ./audit-service
    container_name: rideshare-audit-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: rideshare-notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  grpc-server:
    build: ./ride-grpc-server
    container_name: rideshare-grpc-server
    ports:
      - "8083:8083"
      - "9090:9090"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  grpc-client:
    build: ./ride-grpc-client
    container_name: rideshare-grpc-client
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - GRPC_CLIENT_ANALYTICS_SERVER_HOST=grpc-server
      - GRPC_CLIENT_ANALYTICS_SERVER_PORT=9090
    depends_on:
      rabbitmq:
        condition: service_healthy
      grpc-server:
        condition: service_started